name: Validate content store

on:
  push:
    paths: ['**.py', '.github/workflows/validate.yml']
  pull_request:
    paths: ['**.py', '.github/workflows/validate.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Payment verification and invoice tests (synthetic; no transfers)
        run: python -B test_payments.py -v
      - name: HTTP checkout and private-delivery tests (synthetic)
        run: python -B -m unittest discover -s tests -v
